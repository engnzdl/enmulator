name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npx vite build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}

      - name: Rename artifacts to stable names
        shell: bash
        run: |
          set -e
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          OUT="$BUNDLE/out"
          mkdir -p "$OUT"
          # macOS
          ls "$BUNDLE"/dmg/*.dmg >/dev/null 2>&1 && cp "$BUNDLE"/dmg/*.dmg "$OUT/Enmulator_aarch64.dmg"
          # Windows
          ls "$BUNDLE"/msi/*.msi >/dev/null 2>&1 && cp "$BUNDLE"/msi/*.msi "$OUT/Enmulator_x64_en-US.msi"
          # Linux
          ls "$BUNDLE"/deb/*.deb >/dev/null 2>&1 && cp "$BUNDLE"/deb/*.deb "$OUT/enmulator_amd64.deb"
          ls "$BUNDLE"/appimage/*.AppImage >/dev/null 2>&1 && cp "$BUNDLE"/appimage/*.AppImage "$OUT/enmulator_amd64.AppImage"
          echo "=== staged artifacts ==="
          ls -la "$OUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
